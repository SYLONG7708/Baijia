<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1417" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Baijia Live" />
    <title>百家樂現場分析</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=20260710-ensemble-calibrated" />
  </head>
  <body data-mode="live">
    <main class="app-shell live-shell">
      <header class="topbar live-topbar">
        <div>
          <p class="eyebrow">Baijia Live</p>
          <h1>現場百家樂分析</h1>
        </div>
        <nav class="top-actions" aria-label="頁面切換">
          <a class="ghost-btn nav-link" href="./logic.html">分析邏輯</a>
          <a class="ghost-btn nav-link" href="./">監控版</a>
        </nav>
      </header>

      <section class="analysis-band live-analysis-band" aria-label="現場前 8 手分析">
        <div>
          <h2>輸入前 8 手</h2>
          <div class="pattern-buttons">
            <button class="pattern-result-btn banker" data-result="banker" type="button">莊</button>
            <button class="pattern-result-btn player" data-result="player" type="button">閒</button>
            <button class="pattern-result-btn tie" data-result="tie" type="button">和</button>
          </div>
          <div class="side-flag-buttons" aria-label="特殊項">
            <button class="side-flag-btn bankerPair" data-flag="bankerPair" type="button">莊對</button>
            <button class="side-flag-btn playerPair" data-flag="playerPair" type="button">閒對</button>
            <button class="side-flag-btn luckySix" data-flag="luckySix" type="button">幸運6</button>
          </div>
          <div class="card-input-panel" aria-label="點數牌面輸入">
            <div class="card-side-input banker-card-input">
              <div class="card-side-head">
                <b>莊牌</b>
                <span data-card-summary="banker">未輸入</span>
              </div>
              <div class="card-rank-grid">
                <button data-card-side="banker" data-card-rank="1" type="button">1</button>
                <button data-card-side="banker" data-card-rank="2" type="button">2</button>
                <button data-card-side="banker" data-card-rank="3" type="button">3</button>
                <button data-card-side="banker" data-card-rank="4" type="button">4</button>
                <button data-card-side="banker" data-card-rank="5" type="button">5</button>
                <button data-card-side="banker" data-card-rank="6" type="button">6</button>
                <button data-card-side="banker" data-card-rank="7" type="button">7</button>
                <button data-card-side="banker" data-card-rank="8" type="button">8</button>
                <button data-card-side="banker" data-card-rank="9" type="button">9</button>
                <button data-card-side="banker" data-card-rank="10" type="button">10</button>
                <button data-card-side="banker" data-card-rank="J" type="button">J</button>
                <button data-card-side="banker" data-card-rank="Q" type="button">Q</button>
                <button data-card-side="banker" data-card-rank="K" type="button">K</button>
                <button class="card-pair-btn" data-card-pair="banker" type="button">對子</button>
                <button class="card-clear-btn" data-card-clear="banker" type="button">清</button>
              </div>
            </div>
            <div class="card-side-input player-card-input">
              <div class="card-side-head">
                <b>閒牌</b>
                <span data-card-summary="player">未輸入</span>
              </div>
              <div class="card-rank-grid">
                <button data-card-side="player" data-card-rank="1" type="button">1</button>
                <button data-card-side="player" data-card-rank="2" type="button">2</button>
                <button data-card-side="player" data-card-rank="3" type="button">3</button>
                <button data-card-side="player" data-card-rank="4" type="button">4</button>
                <button data-card-side="player" data-card-rank="5" type="button">5</button>
                <button data-card-side="player" data-card-rank="6" type="button">6</button>
                <button data-card-side="player" data-card-rank="7" type="button">7</button>
                <button data-card-side="player" data-card-rank="8" type="button">8</button>
                <button data-card-side="player" data-card-rank="9" type="button">9</button>
                <button data-card-side="player" data-card-rank="10" type="button">10</button>
                <button data-card-side="player" data-card-rank="J" type="button">J</button>
                <button data-card-side="player" data-card-rank="Q" type="button">Q</button>
                <button data-card-side="player" data-card-rank="K" type="button">K</button>
                <button class="card-pair-btn" data-card-pair="player" type="button">對子</button>
                <button class="card-clear-btn" data-card-clear="player" type="button">清</button>
              </div>
            </div>
          </div>
          <textarea id="patternInput" readonly placeholder="莊 閒 莊 和 閒 莊 閒 莊"></textarea>
          <div class="pattern-tools">
            <span id="patternCount">0 手</span>
            <button id="undoPatternBtn" class="ghost-btn small" type="button">退一手</button>
            <button id="clearPatternBtn" class="ghost-btn small" type="button">清空</button>
            <button id="analyzeBtn" class="primary-btn" type="button">立即分析</button>
          </div>
        </div>
        <article class="prediction-main">
          <span>下一手預測</span>
          <strong id="nextResult">等待 8 手</strong>
          <p id="nextDescription">輸入莊、閒、和後自動分析最近 8 手</p>
        </article>
      </section>

      <section id="advancedAnalysis" class="advanced-analysis" aria-label="advanced analysis"></section>

      <section class="prediction-grid" aria-label="機率列表">
        <article>
          <span>莊 / 閒 / 和 / 莊對 / 閒對 / 幸運6</span>
          <div id="sidePrediction" class="probability-list">-</div>
        </article>
      </section>
    </main>

    <script src="app.js?v=20260710-ensemble-calibrated"></script>
  </body>
</html>
